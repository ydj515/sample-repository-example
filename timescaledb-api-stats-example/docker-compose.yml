services:
  timescaledb:
    image: timescale/timescaledb:2.28.2-pg17-oss
    container_name: timescaledb-api-stats-db
    environment:
      POSTGRES_DB: api_stats
      POSTGRES_USER: api_stats
      POSTGRES_PASSWORD: api_stats
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infra/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_stats -d api_stats"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: timescaledb-api-stats-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: timescaledb-api-stats-postgres-exporter
    environment:
      - DATA_SOURCE_URI=timescaledb:5432/api_stats?sslmode=disable
      - DATA_SOURCE_USER=api_stats
      - DATA_SOURCE_PASS=api_stats
      - PG_EXPORTER_DISABLE_DEFAULT_METRICS=false
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=false
    ports:
      - "9187:9187"
    depends_on:
      timescaledb:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: timescaledb-api-stats-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres-exporter

  grafana:
    image: grafana/grafana:11.5.2
    container_name: timescaledb-api-stats-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - timescaledb

volumes:
  timescaledb-data:
  redis-data:
  prometheus-data:
  grafana-data:
