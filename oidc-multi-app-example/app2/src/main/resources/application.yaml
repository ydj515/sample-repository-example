spring:
  application:
    name: oidc-app2
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:oidc-app2}
            client-secret: ${OIDC_CLIENT_SECRET:oidc-app2-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
  session:
    store-type: redis
    redis:
      namespace: oidc-multi-app-example:session
      repository-type: indexed

server:
  port: 8082
  servlet:
    session:
      cookie:
        name: APP2SESSION
        http-only: true
        same-site: lax
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  session:
    redis-enabled: true
    app-id: app2
    revalidation:
      standard-ttl: 5s
      sensitive-ttl: 1s
  security:
    logout-cookie-name: APP2SESSION
    access:
      user-roles:
        - app2-user
      admin-roles:
        - app2-admin
      master-admin-role: master-admin
  view:
    app-name: App 2
    app-description: 같은 Keycloak realm을 신뢰하는 두 번째 애플리케이션입니다.
    client-id: oidc-app2
    peer-app-name: App 1
    peer-app-url: http://localhost:8081
    peer-access-roles:
      - app1-user
      - app1-admin
    environment-name: Production Sandbox
    suite-name: Identity Federation Suite

logging:
  level:
    org.springframework.security: INFO
