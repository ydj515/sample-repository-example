spring:
  config:
    activate:
      on-profile: test
  session:
    store-type: redis
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: http://localhost:9000/realms/test/protocol/openid-connect/auth
            token-uri: http://localhost:9000/realms/test/protocol/openid-connect/token
            user-info-uri: http://localhost:9000/realms/test/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:9000/realms/test/protocol/openid-connect/certs

app:
  session:
    redis-enabled: false
  security:
    end-session-uri: http://localhost:9000/realms/test/protocol/openid-connect/logout
