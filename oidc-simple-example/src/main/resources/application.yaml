spring:
  application:
    name: oidc-simple-example
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:oidc-simple-example}
            client-secret: ${OIDC_CLIENT_SECRET:oidc-simple-example-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
  session:
    store-type: redis
    redis:
      namespace: oidc-simple-example:session
      repository-type: indexed

server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  session:
    redis-enabled: true
  security:
    revalidation:
      standard-ttl: 5s
      sensitive-ttl: 1s

logging:
  level:
    org.springframework.security: INFO
