server:
  port: 8080
logging:
  level:
    root: debug

spring:
  application:
    name: graphql-example
  graphql:
    graphiql:
      enabled: true
    schema: # 기본 디렉토리: classpath:graphql/**, 기본 확장자 : graphqls
      file-extensions: graphql
    websocket:
      path: graphql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test
    username: sa
    password:
    h2:
      console:
        enabled: true
        path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true       # 콘솔에 SQL 로그 출력
    open-in-view: false
    properties:
      hibernate:
        format_sql: true