
"""
Query 루트 타입
"""
type Query {
  """
  유저 정보 조회
  - id 기준으로 User 조회
  - 없으면 null 반환 (또는 서버에서 예외 발생시 GraphQL Error)
  """
  user(id: ID!): User

  """
  제품 목록 전체 조회
  - Electronics / Clothing 모두 포함
  """
  productList: [Product!]!

  """
  특정 유저의 장바구니 조회
  """
  cart(userId: ID!): Cart

  """
  키워드 검색
  - User / Electronics / Clothing 이름에서 keyword 포함 검색
  """
  search(keyword: String!): [SearchResult!]!
}

"""
검색 결과용 union
- 이름에 keyword가 포함되는 User / Electronics / Clothing 모두 반환
"""
union SearchResult = User | Electronics | Clothing
