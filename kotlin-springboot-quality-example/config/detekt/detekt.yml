config:
  validation: true
  warningsAsErrors: true

complexity:
  CyclomaticComplexMethod:
    allowedComplexity: 10
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 15

# ktlint owns identifier casing, imports and whitespace.
# Detekt-specific naming semantics (for example boolean prefixes) are not enforced.
naming:
  active: false
style:
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
