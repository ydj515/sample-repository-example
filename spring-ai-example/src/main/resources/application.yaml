server:
  port: 8080
logging:
  level:
    root: INFO
    org.springframework.ai: DEBUG

spring:
  application:
    name: spring-ai-example
  ai:
    chat:
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY:test-openai-key}
      chat:
        options:
          model: gpt-4o-mini
#    openai:
#      api-key: ${GEMINI_KEY}
#      chat:
#        options:
#          model: gemini-3-flash-preview
#          temperature: 1.0
#          max-tokens: 1000
#        completions-path: /v1/chat/completions
#        base-url: https://generativelanguage.googleapis.com/v1beta/openai/
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:test-key}
      chat:
        options:
          model: claude-sonnet-4-5

app:
  chat:
    default-provider: openai
    memory:
      max-turns: 3
