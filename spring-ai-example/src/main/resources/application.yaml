server:
  port: 8080
logging:
  level:
    root: INFO
    org.springframework.ai: DEBUG

spring:
  application:
    name: spring-ai-example
  # PostgreSQL Datasource (PgVector용)
  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST:localhost}:${PGVECTOR_PORT:5432}/${PGVECTOR_DB:mydatabase}
    username: ${PGVECTOR_USER:myuser}
    password: ${PGVECTOR_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      # Chat Memory용 PgVector 테이블 수동 생성
      schema-locations:
        - "classpath:/schema/chat_pgvector.sql"
  # 파일 업로드(Multipart) 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    chat:
      client:
        enabled: false
      # JDBC Chat Memory 자동 스키마 초기화
      memory:
        repository:
          jdbc:
            initialize-schema: always
    # PgVector VectorStore 자동 스키마 초기화
    vectorstore:
      pgvector:
        initialize-schema: true
    openai:
      api-key: ${OPENAI_API_KEY:test-openai-key}
      chat:
        options:
          model: gpt-4o-mini
#    openai:
#      api-key: ${GEMINI_KEY}
#      chat:
#        options:
#          model: gemini-3-flash-preview
#          temperature: 1.0
#          max-tokens: 1000
#        completions-path: /v1/chat/completions
#        base-url: https://generativelanguage.googleapis.com/v1beta/openai/
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:test-key}
      chat:
        options:
          model: claude-sonnet-4-5
    mcp:
      client:
        # MCP 클라이언트(통신 기능) 활성화
        enabled: true
        name: spring-ai-example-mcp-client
        version: 1.0.0
        type: SYNC
        request-timeout: 20s
        root-change-notification: false
        toolcallback:
          # MCP 서버에서 발견된 도구들을 ToolCallbackProvider Bean으로 자동 등록
          enabled: true
        stdio:
          # stdio(표준 입출력) 방식으로 연결할 MCP 서버 설정 파일 위치
          servers-configuration: classpath:mcp-servers.json
        sse:
          connections:
            spring-ai-webmvc-example:
              url: http://localhost:8088
              sse-endpoint: /custom-sse
            spring-ai-mcpserver-webflux:
              url: http://localhost:8089
              sse-endpoint: /sse

app:
  chat:
    default-provider: openai
    memory:
      max-turns: 3
